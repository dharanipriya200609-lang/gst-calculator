<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colorful GST Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #6a11cb,
        #2575fc,
        #00c9a7
    );

    min-height: 100vh;
    padding: 25px;
}

.container {
    max-width: 520px;
    margin: 20px auto;

    background: rgba(255,255,255,0.96);

    padding: 28px;

    border-radius: 25px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.25);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.icon {
    font-size: 50px;
}

h1 {
    margin: 5px 0;

    background: linear-gradient(
        90deg,
        #6a11cb,
        #2575fc,
        #00a884
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #666;
    font-size: 14px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    color: #333;
}

input,
select {
    width: 100%;
    padding: 14px;

    margin-top: 8px;

    border: 2px solid #ddd;

    border-radius: 12px;

    font-size: 16px;

    outline: none;

    transition: 0.3s;
}

input:focus,
select:focus {
    border-color: #2575fc;

    box-shadow:
        0 0 8px rgba(37,117,252,0.3);
}

button {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    border: none;

    border-radius: 12px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.calculate {
    color: white;

    background: linear-gradient(
        90deg,
        #ff512f,
        #dd2476
    );

    box-shadow:
        0 6px 15px rgba(221,36,118,0.3);
}

.calculate:hover {
    transform: translateY(-2px);
}

.reset {
    color: white;

    background: linear-gradient(
        90deg,
        #11998e,
        #38ef7d
    );
}

.result {
    display: none;

    margin-top: 25px;

    padding: 20px;

    border-radius: 18px;

    background: linear-gradient(
        135deg,
        #fff1eb,
        #e8f5ff
    );

    border-left: 6px solid #6a11cb;

    line-height: 2;

    color: #333;
}

.result-title {
    font-size: 20px;

    font-weight: bold;

    color: #6a11cb;

    margin-bottom: 8px;
}

.total {
    margin-top: 10px;

    padding: 12px;

    border-radius: 10px;

    background: linear-gradient(
        90deg,
        #6a11cb,
        #2575fc
    );

    color: white;

    font-size: 21px;

    font-weight: bold;

    text-align: center;
}

.footer {
    text-align: center;

    margin-top: 22px;

    color: #777;

    font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">🧮</div>

        <h1>GST Calculator</h1>

        <div class="subtitle">
            Fast • Simple • Free
        </div>

    </div>


    <label>💰 Enter Amount (₹)</label>

    <input
        type="number"
        id="amount"
        placeholder="Example: 10000"
        min="0"
    >


    <label>📊 GST Rate</label>

    <select id="gstRate">

        <option value="5">5%</option>

        <option value="12">12%</option>

        <option value="18" selected>18%</option>

        <option value="28">28%</option>

    </select>


    <label>🔄 Calculation Type</label>

    <select id="type">

        <option value="exclusive">
            GST Exclusive
        </option>

        <option value="inclusive">
            GST Inclusive
        </option>

    </select>


    <label>🏷️ Tax Type</label>

    <select id="taxType">

        <option value="cgstsgst">
            CGST + SGST
        </option>

        <option value="igst">
            IGST
        </option>

    </select>


    <button
        class="calculate"
        onclick="calculateGST()"
    >
        ✨ Calculate GST
    </button>


    <button
        class="reset"
        onclick="resetCalculator()"
    >
        🔄 Reset
    </button>


    <div
        class="result"
        id="result"
    ></div>


    <div class="footer">
        Free GST Calculator
    </div>

</div>


<script>

function calculateGST() {

    let amount =
        Number(
            document.getElementById("amount").value
        );

    let rate =
        Number(
            document.getElementById("gstRate").value
        );

    let type =
        document.getElementById("type").value;

    let taxType =
        document.getElementById("taxType").value;


    if (!amount || amount <= 0) {

        alert(
            "Please enter a valid amount."
        );

        return;
    }


    let baseAmount;
    let gstAmount;
    let finalAmount;


    if (type === "exclusive") {

        baseAmount = amount;

        gstAmount =
            amount * rate / 100;

        finalAmount =
            amount + gstAmount;

    }

    else {

        finalAmount = amount;

        gstAmount =
            amount * rate /
            (100 + rate);

        baseAmount =
            amount - gstAmount;
    }


    let html = "";

    html +=
        "<div class='result-title'>📋 GST Result</div>";

    html +=
        "<b>Base Amount:</b> ₹" +
        baseAmount.toFixed(2) +
        "<br>";


    if (taxType === "cgstsgst") {

        let cgst =
            gstAmount / 2;

        let sgst =
            gstAmount / 2;


        html +=
            "<b>🟣 CGST (" +
            (rate / 2) +
            "%):</b> ₹" +
            cgst.toFixed(2) +
            "<br>";


        html +=
            "<b>🔵 SGST (" +
            (rate / 2) +
            "%):</b> ₹" +
            sgst.toFixed(2) +
            "<br>";

    }

    else {

        html +=
            "<b>🟢 IGST (" +
            rate +
            "%):</b> ₹" +
            gstAmount.toFixed(2) +
            "<br>";
    }


    html +=
        "<b>💵 Total GST:</b> ₹" +
        gstAmount.toFixed(2);


    html +=
        "<div class='total'>" +
        "Final Amount: ₹" +
        finalAmount.toFixed(2) +
        "</div>";


    let result =
        document.getElementById("result");


    result.innerHTML = html;

    result.style.display = "block";
}


function resetCalculator() {

    document.getElementById("amount").value = "";

    document.getElementById("gstRate").value = "18";

    document.getElementById("type").value =
        "exclusive";

    document.getElementById("taxType").value =
        "cgstsgst";


    let result =
        document.getElementById("result");

    result.style.display = "none";

    result.innerHTML = "";
}

</script>

</body>
</html>
