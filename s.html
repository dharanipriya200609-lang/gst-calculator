<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    margin-top: 20px;
    cursor: pointer;
    font-size: 16px;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
    line-height: 1.8;
}
</style>
</head>

<body>

<div class="container">

<h1>GST Calculator</h1>

<label>Amount (₹)</label>
<input type="number" id="amount" placeholder="Enter amount">

<label>GST Rate</label>
<select id="gst">
    <option value="5">5%</option>
    <option value="12">12%</option>
    <option value="18" selected>18%</option>
    <option value="28">28%</option>
</select>

<button onclick="calculateGST()">Calculate GST</button>

<div class="result" id="result">
    Enter amount and click Calculate.
</div>

</div>

<script>

function calculateGST() {

    let amount = Number(document.getElementById("amount").value);
    let gstRate = Number(document.getElementById("gst").value);

    if (amount <= 0) {
        document.getElementById("result").innerHTML =
        "Please enter a valid amount.";
        return;
    }

    let gstAmount = amount * gstRate / 100;
    let cgst = gstAmount / 2;
    let sgst = gstAmount / 2;
    let total = amount + gstAmount;

    document.getElementById("result").innerHTML =
        "Amount: ₹" + amount.toFixed(2) + "<br>" +
        "CGST: ₹" + cgst.toFixed(2) + "<br>" +
        "SGST: ₹" + sgst.toFixed(2) + "<br>" +
        "Total GST: ₹" + gstAmount.toFixed(2) + "<br>" +
        "<b>Final Amount: ₹" + total.toFixed(2) + "</b>";
}

</script>

</body>
</html>
